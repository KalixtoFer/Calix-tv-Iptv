name: Compilar APK Android TV & Móvil

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para Android TV
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar dependencias web
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 5. Compilar interfaz web
        run: |
          npm run build

      - name: 6. Sincronizar o crear proyecto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creando proyecto nativo Android..."
            npx cap add android
          else
            echo "Sincronizando proyecto Android..."
            npx cap sync android
          fi

      - name: 7. Configurar Android SDK API 36 y Licencias
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" || true

      - name: 8. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 9. Permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: 10. Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk CalixTV-v1.0.apk

      - name: 11. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CalixTV-v1.0-APK
          path: CalixTV-v1.0.apk
          if-no-files-found: error
