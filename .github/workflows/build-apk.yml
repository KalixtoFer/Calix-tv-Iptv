name: Compilar APK Android TV & Móvil

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para Android TV
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Instalar dependencias web
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 5. Compilar interfaz web
        run: |
          npm run build

      - name: 6. Sincronizar o crear proyecto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creando proyecto nativo Android..."
            npx cap add android
          else
            echo "Sincronizando proyecto Android..."
            npx cap sync android
          fi

      - name: 7. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 8. Permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: 9. Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk CalixTV-v1.0.apk

      - name: 10. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CalixTV-v1.0-APK
          path: CalixTV-v1.0.apk
          if-no-files-found: error
