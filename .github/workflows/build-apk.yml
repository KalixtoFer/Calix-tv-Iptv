name: Compilar APK Android TV & Móvil

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para Android TV
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar dependencias web
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 5. Compilar interfaz web
        run: |
          npm run build

      - name: 6. Sincronizar o crear proyecto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creando proyecto nativo Android..."
            npx cap add android
          else
            echo "Sincronizando proyecto Android..."
            npx cap sync android
          fi

      - name: 6.5. Asegurar estructura de paquete, colores y SDK 35
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          mkdir -p android/app/src/main/java/com/calixtv/app
          cat << 'EOF' > android/app/src/main/java/com/calixtv/app/MainActivity.java
          package com.calixtv.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#06b6d4</color>
              <color name="colorPrimaryDark">#08090d</color>
              <color name="colorAccent">#3b82f6</color>
          </resources>
          EOF
          echo "--- variables.gradle ---"
          cat android/variables.gradle

      - name: 7. Configurar Android SDK API 35 y Licencias
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "--- Plataformas instaladas ---"
          ls $ANDROID_HOME/platforms
          echo "--- Build-tools instalados ---"
          ls $ANDROID_HOME/build-tools

      - name: 8. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 9. Permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: 10. Compilar APK con Gradle
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --console=plain --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk CalixTV-v1.0.apk

      - name: 11. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CalixTV-v1.0-APK
          path: CalixTV-v1.0.apk
          if-no-files-found: error
