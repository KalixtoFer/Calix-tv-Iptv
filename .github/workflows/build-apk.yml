name: Compilar APK Android TV & Móvil

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para Android TV
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar dependencias web
        run: |
          npm install --legacy-peer-deps --no-audit

      - name: 5. Compilar interfaz web
        run: |
          npm run build

      - name: 6. Sincronizar o crear proyecto Android
        run: |
          if [ ! -d "android" ]; then
            echo "Creando proyecto nativo Android..."
            npx cap add android
          else
            echo "Sincronizando proyecto Android..."
            npx cap sync android
          fi

      - name: 6.1. Optimizar splash screens y assets (<1.5MB)
        run: |
          node scripts/optimize-assets.js

      - name: 6.5. Asegurar estructura de paquete, colores y SDK 35
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/' android/variables.gradle
          mkdir -p android/app/src/main/java/com/calixtv/app
          cat << 'EOF' > android/app/src/main/java/com/calixtv/app/MainActivity.java
          package com.calixtv.app;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              public static final String NOTIFICATION_CHANNEL_ID = "calix_tv_updates";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePlayerPlugin.class);
                  super.onCreate(savedInstanceState);

                  hideSystemUI();
                  createNotificationChannel();
                  requestNotificationPermission();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  hideSystemUI();
                  requestNotificationPermission();
              }

              private void hideSystemUI() {
                  Window window = getWindow();
                  if (window == null) return;

                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowCompat.setDecorFitsSystemWindows(window, false);
                      WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, window.getDecorView());
                      if (controller != null) {
                          controller.hide(WindowInsetsCompat.Type.systemBars());
                          controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      View decorView = window.getDecorView();
                      decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          NOTIFICATION_CHANNEL_ID,
                          "Actualizaciones Calix TV",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Avisos y progreso de descargas de actualizaciones de Calix TV");
                      channel.enableLights(true);
                      channel.enableVibration(true);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                      }
                  }
              }

              public void requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }
              }
          }
          EOF
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#06b6d4</color>
              <color name="colorPrimaryDark">#08090d</color>
              <color name="colorAccent">#3b82f6</color>
          </resources>
          EOF
          echo "--- variables.gradle ---"
          cat android/variables.gradle

      - name: 6.6. Instalar reproductor nativo (libVLC)
        run: python3 scripts/install-native-player.py

      - name: 7. Configurar Android SDK API 35 y Licencias
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          echo "--- Plataformas instaladas ---"
          ls $ANDROID_HOME/platforms
          echo "--- Build-tools instalados ---"
          ls $ANDROID_HOME/build-tools

      - name: 8. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 9. Permisos de ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: 10. Compilar APK optimizado (Release ultra-liviano <15MB)
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon --console=plain --stacktrace || ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
          cd ..
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk CalixTV-v1.0.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk CalixTV-v1.0.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk CalixTV-v1.0.apk
          fi
          echo "=== TAMAÑO DEL APK GENERADO ==="
          ls -lh CalixTV-v1.0.apk

      - name: 11. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CalixTV-v1.0-APK
          path: CalixTV-v1.0.apk
          if-no-files-found: error
