name: Compilar APK Android TV & Móvil

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para Android TV
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: 4. Compilar interfaz web para producción
        run: npm run build

      - name: 5. Sincronizar archivos con el proyecto Android
        run: npx cap sync android

      - name: 6. Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 7. Asignar permisos de ejecución al compilador Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK Nativo con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk NexusIPTVPro-v2.5.4.apk

      - name: 9. Generar enlace de descarga del APK listo
        uses: actions/upload-artifact@v4
        with:
          name: NexusIPTVPro-v2.5.4-APK
          path: NexusIPTVPro-v2.5.4.apk
          if-no-files-found: error
