name: Calix TV - Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso a gradlew
        run: chmod +x gradlew
      - name: Tests unitarios
        run: ./gradlew --no-daemon testDebugUnitTest
      # Firma opcional: si cargaste los 4 secretos en GitHub (Settings > Secrets > Actions) se genera el APK de release firmado
      - name: Preparar firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > calix.keystore
            {
              echo "storeFile=calix.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
      # Sin secretos de firma: se reutiliza siempre la misma clave de depuración (cache), así cada APK se instala sobre el anterior
      - name: Clave de firma estable (cache)
        if: env.SIGNED != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calix-debug-keystore-v1
      - name: Compilar APK (release)
        run: ./gradlew --no-daemon assembleRelease
      - name: Renombrar APK
        run: |
          mkdir -p out
          f=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$f" "out/Calix-TV-1.3.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Calix-TV-APK
          path: out/*.apk
