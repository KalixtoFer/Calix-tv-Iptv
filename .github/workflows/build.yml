name: Calix TV - Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK como Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso a gradlew
        run: chmod +x gradlew
      - name: Tests unitarios
        run: ./gradlew --no-daemon testDebugUnitTest
      # Firma opcional: si cargaste los 4 secretos en GitHub (Settings > Secrets > Actions) se genera el APK de release firmado
      - name: Preparar firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > calix.keystore
            {
              echo "storeFile=calix.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
      # Sin secretos de firma: se reutiliza siempre la misma clave de depuración (cache), así cada APK se instala sobre el anterior
      - name: Clave de firma estable (cache)
        if: env.SIGNED != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calix-debug-keystore-v1
      # Pruebas de lógica pura (sin Android). No bloquean el APK: si fallan, se ve en el log y en el resumen.
      - name: Pruebas unitarias
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compilar APK (release)
        run: ./gradlew --no-daemon assembleRelease
      - name: Renombrar APK
        run: |
          mkdir -p out
          f=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$f" "out/Calix-TV-1.3.${{ github.run_number }}.apk"
      # Release con nombre fijo (Calix-TV.apk): el link releases/latest/download/Calix-TV.apk siempre apunta a la última versión
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          mkdir -p rel
          cp "out/Calix-TV-1.3.$N.apk" rel/
          cp "out/Calix-TV-1.3.$N.apk" rel/Calix-TV.apk
          gh release create "v1.3.$N" rel/Calix-TV-1.3.$N.apk rel/Calix-TV.apk --target "$GITHUB_SHA" --title "Calix TV 1.3.$N" --notes "Compilación automática del commit ${GITHUB_SHA::7}." --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Calix-TV-APK
          path: out/*.apk
